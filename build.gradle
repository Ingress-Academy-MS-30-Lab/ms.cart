plugins {
    id "java"
    id "org.springframework.boot" version "$springBootVersion"
    id "io.spring.dependency-management" version "$dependencyManagementVersion"
    id "groovy"
}

group = "az.ingress"
sourceCompatibility = "17"

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    //spring
    implementation "org.springframework.boot:spring-boot-starter-web"

    //database
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.liquibase:liquibase-core"
    runtimeOnly "org.postgresql:postgresql"

    //lombok
    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"

    //swagger
    implementation "org.springdoc:springdoc-openapi-ui:$openApiVersion"

    // OpenFeign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.3.0'

    //redis
    implementation "org.redisson:redisson:${redisVersion}"

     //rabbitmq
    implementation "org.springframework.boot:spring-boot-starter-amqp:${rabbitmqAmqpVersion}"

    //mapstruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    // ShedLock
    implementation "net.javacrumbs.shedlock:shedlock-spring:${shedlockVersion}"
    implementation "net.javacrumbs.shedlock:shedlock-provider-jdbc-template:${shedlockVersion}"

    //testing
    testImplementation "org.apache.groovy:groovy:$groovyVersion"
    testImplementation "io.github.benas:random-beans:$randomBeansVersion"
    testImplementation "org.spockframework:spock-spring:$spockSpringVersion"
    testImplementation "org.springframework.boot:spring-boot-starter-test"

}

test {
    useJUnitPlatform()
}