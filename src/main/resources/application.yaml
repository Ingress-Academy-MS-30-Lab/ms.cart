server:
  port: 8080

  product:
    base-url: http://ms-product:8080

  spring:
    datasource:
      url: jdbc:postgresql://localhost:5432/postgres
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: validate


    rabbitmq:
      host: localhost
      port: 5672
      username: guest
      password: guest


    redis:
      host: localhost
      port: 6379
      password: redis_password
      timeout: 2000

    liquibase:
      drop-first: true