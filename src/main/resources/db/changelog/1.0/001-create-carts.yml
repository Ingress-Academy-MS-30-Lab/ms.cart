databaseChangeLog:
  - changeSet:
      id: 001-create-carts
      author: you
      changes:
        - createTable:
            tableName: carts
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: buyer_id
                  type: BIGINT
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITHOUT TIME ZONE
        - addCheckConstraint:
            tableName: carts
            constraintName: ck_carts_status
            checkConstraint: "status in ('CREATED','ORDERED','DELETED')"